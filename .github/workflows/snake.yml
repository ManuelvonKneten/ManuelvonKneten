name: generate contribution snake

on:
  schedule:
    - cron: "0 0 * * *"
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: generate contribution-grid snake
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#1b222c&color_dots=#eceef1,#bfe4f5,#7fc8ea,#2ea0d6,#0c8ce9&color_bg=#ffffff
            dist/github-contribution-grid-snake-dark.svg?color_snake=#4fd1ff&color_dots=#161b22,#113042,#155068,#1f7fa3,#4fd1ff&color_bg=#0d1117

      - name: push snake to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

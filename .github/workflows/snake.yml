name: generate contribution snake

on:
  schedule:
    - cron: "0 0 * * *"
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: generate contribution-grid snake
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%231b222c&color_dots=%23eceef1,%23bfe4f5,%237fc8ea,%232ea0d6,%230c8ce9&color_bg=%23ffffff
            dist/github-contribution-grid-snake-dark.svg?color_snake=%234fd1ff&color_dots=%23161b22,%23113042,%23155068,%231f7fa3,%234fd1ff&color_bg=%230d1117

      - name: push snake to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
